# dkms.conf — LHSR kernel module for DKMS
#
# Installed to /usr/src/lhsr-<version>/dkms.conf
# Builds dm-lhsr.ko for the running kernel on dpkg or manual dkms install.

PACKAGE_NAME="lhsr"
PACKAGE_VERSION="1.3.0"

BUILT_MODULE_NAME[0]="dm-lhsr"
DEST_MODULE_LOCATION[0]="/updates/dkms"

AUTOINSTALL="yes"

MAKE[0]="make -C kernel/dm-lhsr KERNEL_DIR=/lib/modules/${kernelver}/build"

CLEAN="make -C kernel/dm-lhsr clean"

PATCH=""
